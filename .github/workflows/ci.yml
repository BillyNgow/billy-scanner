name: Billy Scanner CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - milestone2a-ci-tests

jobs:
  tests:
    name: Run pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: pytest -q --cov=. --cov-report=term-missing --cov-config=.coveragerc
