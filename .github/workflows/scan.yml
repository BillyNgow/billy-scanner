name: Billy Options Scanner

on:
  schedule:
    # 20:30 UTC weekdays
    # = 04:30 AM MYT (next day) during US daylight saving time
    # = ~30 min after US market close (16:00 ET)
    # Note: fixed UTC cron does not perfectly handle US DST shifts.
    - cron: '30 20 * * 1-5'

  # Allow manual trigger anytime
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Options Scanner
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AV_API_KEY:       ${{ secrets.AV_API_KEY }}
        run: python billy_options_scanner.py

      - name: Upload scan results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
