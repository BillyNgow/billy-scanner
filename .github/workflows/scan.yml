name: Billy Options Scanner

on:
  schedule:
    - cron: '30 13 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug secrets
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: |
          python3 -c "
          import os, requests
          key = os.environ.get('ALPHAVANTAGE_KEY','NOT FOUND')
          print(f'Key length: {len(key)}')
          print(f'Key starts: {key[:4]}...')
          url = f'https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol=IBM&outputsize=compact&apikey={key}'
          r = requests.get(url, timeout=15)
          data = r.json()
          ts = data.get('Time Series (Daily)',{})
          dates = sorted(ts.keys(),reverse=True)
          if dates:
              print(f'IBM price: {ts[dates[0]][chr(52)+chr(46)+chr(32)+chr(99)+chr(108)+chr(111)+chr(115)+chr(101)]}')
              print('Alpha Vantage working!')
          else:
              print(f'Response: {str(data)[:200]}')
          "

      - name: Run Options Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: python billy_options_scanner.py
